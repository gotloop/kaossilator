<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .box{fill:#fff;stroke:#999}
      .on{fill:#333;stroke:#333}
      .lbl{fill:#777;font-size:11px;letter-spacing:.06em}
      .w{fill:#fff}
      .call{fill:#c0392b;font-size:12px}
      .callline{stroke:#c0392b;stroke-width:1;fill:none}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Layers panel: close-up of one layer</text>
  <text x="24" y="58" class="lbl">EACH LAYER = ONE RECORDING PASS, STORED AS TOUCH EVENTS (TIME, X, Y, DOWN/UP) + THE PROGRAM/ARP/SCALE USED</text>

  <!-- header controls -->
  <rect x="24" y="80" width="1152" height="240" fill="#fafafa" stroke="#bbb"/>
  <rect x="40" y="96" width="14" height="28" fill="#2e86de"/>
  <text x="64" y="108" font-weight="bold" font-size="15">Layer 1</text>
  <text x="64" y="124" class="lbl">b.33 ACID BASS · ION · C3 · ARP OFF</text>
  <rect x="300" y="98" width="28" height="24" class="box"/><text x="314" y="115" text-anchor="middle">M</text>
  <rect x="334" y="98" width="28" height="24" class="box"/><text x="348" y="115" text-anchor="middle">S</text>
  <text x="380" y="115" class="lbl">VOL</text>
  <line x1="410" y1="110" x2="560" y2="110" stroke="#bbb" stroke-width="4"/><circle cx="520" cy="110" r="8" fill="#333"/>
  <text x="572" y="115">-4 dB</text>
  <rect x="640" y="98" width="70" height="24" class="box"/><text x="675" y="115" text-anchor="middle">Rename</text>
  <rect x="716" y="98" width="70" height="24" class="box"/><text x="751" y="115" text-anchor="middle">Solo edit</text>
  <rect x="792" y="98" width="70" height="24" class="box"/><text x="827" y="115" text-anchor="middle">🗑 Delete</text>

  <!-- timeline -->
  <g transform="translate(40,140)">
    <rect width="1120" height="160" fill="#fff" stroke="#ccc"/>
    <!-- pitch grid (scale notes) -->
    <g stroke="#eee">
      <line x1="0" y1="20" x2="1120" y2="20"/><line x1="0" y1="40" x2="1120" y2="40"/><line x1="0" y1="60" x2="1120" y2="60"/>
      <line x1="0" y1="80" x2="1120" y2="80"/><line x1="0" y1="100" x2="1120" y2="100"/><line x1="0" y1="120" x2="1120" y2="120"/>
      <line x1="0" y1="140" x2="1120" y2="140"/>
    </g>
    <g stroke="#ddd"><line x1="140" y1="0" x2="140" y2="160"/><line x1="280" y1="0" x2="280" y2="160"/><line x1="420" y1="0" x2="420" y2="160"/><line x1="560" y1="0" x2="560" y2="160" stroke="#bbb"/><line x1="700" y1="0" x2="700" y2="160"/><line x1="840" y1="0" x2="840" y2="160"/><line x1="980" y1="0" x2="980" y2="160"/></g>
    <!-- erase selection -->
    <rect x="600" y="0" width="150" height="160" fill="#c0392b" opacity=".08"/>
    <line x1="600" y1="0" x2="600" y2="160" stroke="#c0392b" stroke-dasharray="3 3"/><line x1="750" y1="0" x2="750" y2="160" stroke="#c0392b" stroke-dasharray="3 3"/>
    <!-- touch strokes: pitch = vertical (quantized steps), Y param = thickness -->
    <path d="M20 120 H90 V100 H170" fill="none" stroke="#2e86de" stroke-width="4"/>
    <path d="M170 100 H260 V80 H330" fill="none" stroke="#2e86de" stroke-width="8"/>
    <path d="M400 60 H470 V80 H540" fill="none" stroke="#2e86de" stroke-width="12"/>
    <path d="M620 100 H700 V120 H740" fill="none" stroke="#2e86de" stroke-width="5"/>
    <path d="M820 80 H900 V60 H960 V40 H1080" fill="none" stroke="#2e86de" stroke-width="6"/>
    <!-- touch down / up markers -->
    <g fill="#2e86de"><circle cx="20" cy="120" r="5"/><circle cx="400" cy="60" r="5"/><circle cx="620" cy="100" r="5"/><circle cx="820" cy="80" r="5"/></g>
    <g fill="#fff" stroke="#2e86de" stroke-width="2"><circle cx="330" cy="80" r="5"/><circle cx="540" cy="80" r="5"/><circle cx="740" cy="120" r="5"/><circle cx="1080" cy="40" r="5"/></g>
    <!-- playhead -->
    <line x1="880" y1="-6" x2="880" y2="166" stroke="#c0392b" stroke-width="2"/>
    <path d="M874 -12 h12 l-6 8z" fill="#c0392b"/>
    <g fill="#999" font-size="11"><text x="4" y="-4">1</text><text x="144" y="-4">2</text><text x="284" y="-4">3</text><text x="424" y="-4">4</text><text x="564" y="-4">5</text><text x="704" y="-4">6</text><text x="844" y="-4">7</text><text x="984" y="-4">8</text></g>
    <g fill="#999" font-size="10" text-anchor="end"><text x="-4" y="44">G</text><text x="-4" y="84">E</text><text x="-4" y="124">C</text></g>
  </g>

  <!-- context menu for selection -->
  <rect x="660" y="330" width="170" height="90" fill="#fff" stroke="#333"/>
  <text x="676" y="352">✂ Erase selection</text>
  <text x="676" y="376">⎘ Duplicate to new layer</text>
  <text x="676" y="400">♪ Re-quantize to scale</text>
  <line x1="745" y1="300" x2="745" y2="330" class="callline"/>

  <!-- callouts -->
  <g>
    <path d="M60 268 L60 360" class="callline"/>
    <text x="24" y="378" class="call">● finger down   ○ finger up</text>
    <text x="24" y="394" class="call">gaps = silence (finger lifted)</text>

    <path d="M500 196 L500 470" class="callline"/>
    <text x="410" y="488" class="call">vertical = pitch, snapped to the</text>
    <text x="410" y="504" class="call">scale grid (rows = scale notes)</text>
    <text x="410" y="520" class="call">thickness = Y-axis value</text>

    <path d="M920 140 L1000 470" class="callline"/>
    <text x="940" y="488" class="call">playhead, follows the loop</text>
    <text x="940" y="504" class="call">click the ruler to scrub (stopped)</text>
  </g>

  <!-- interactions legend -->
  <rect x="24" y="540" width="1152" height="84" fill="#f4f4f4" stroke="#ddd"/>
  <text x="40" y="562" font-weight="bold">Interactions</text>
  <text x="40" y="582">Drag on the timeline → select a time range → erase / duplicate (replaces "hold LOOP REC/PLAY + SCALE" erase).</text>
  <text x="40" y="600">Hover a layer → its trail lights up on the pad.   Drag the row handle → reorder (visual only).   Volume = per-layer gain node.</text>
  <text x="40" y="618">Saved layers: solid border.   Unsaved take: dashed orange border, with Keep / Discard buttons inline.</text>
</svg>
